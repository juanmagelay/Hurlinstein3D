<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hurlinstein3D</title>
  <style>
    :root {
      --page-color: #08111d;
      --panel-color: rgba(8, 17, 29, 0.92);
      --text-color: #e6edf3;
      --muted-color: #8b9bb0;
      --accent-color: #4de1bd;
      --accent-soft: rgba(77, 225, 189, 0.12);
      --accent-hover: rgba(77, 225, 189, 0.24);
      --border-color: rgba(77, 225, 189, 0.35);
      --slide-time: 200ms;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--page-color);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text-color);
    }

    /* D-16a / TDD 2.3.5: the frame holds the canvas, and later the menus, and
       main.js gives it the CSS size that fills the window */
    #game-frame {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #game-frame canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lucide icons: 24 px grid, 2 px stroke, color from the text */
    .icon {
      width: 18px;
      height: 18px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .admin-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text-color);
      background: var(--accent-soft);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
    }

    .admin-button:hover {
      background: var(--accent-hover);
    }

    .admin-button:focus-visible,
    .admin-icon-button:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    /* D-16b: invisible band along the top edge; the mouse entering it shows the strip */
    #admin-hover-zone {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 10;
    }

    #admin-peek,
    #admin-panel {
      position: fixed;
      top: 0;
      background: var(--panel-color);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-color);
      border-top: none;
      box-sizing: border-box;
      visibility: hidden;
      /* visibility waits for the slide, so a hidden panel cannot take the focus */
      transition: transform var(--slide-time) ease, visibility 0s linear var(--slide-time);
    }

    #admin-peek {
      left: 50%;
      z-index: 11;
      padding: 8px 16px 10px;
      border-radius: 0 0 10px 10px;
      transform: translate(-50%, -100%);
    }

    #admin-panel {
      left: 0;
      right: 0;
      z-index: 12;
      max-height: 70vh;
      overflow-y: auto;
      padding: 12px 24px 14px;
      border-left: none;
      border-right: none;
      transform: translateY(-100%);
    }

    body[data-admin="peek"] #admin-peek {
      transform: translate(-50%, 0);
      visibility: visible;
      transition: transform var(--slide-time) ease;
    }

    body[data-admin="open"] #admin-panel {
      transform: translateY(0);
      visibility: visible;
      transition: transform var(--slide-time) ease;
    }

    body[data-admin="open"] #admin-hover-zone {
      display: none;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .admin-icon-button {
      display: inline-flex;
      padding: 4px;
      color: var(--muted-color);
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .admin-icon-button:hover {
      color: var(--text-color);
      background: var(--accent-soft);
    }

    .admin-section-title {
      margin: 12px 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-color);
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px 16px;
      margin: 0;
    }

    .admin-stats dt {
      font-size: 12px;
      color: var(--muted-color);
    }

    .admin-stats dd {
      margin: 2px 0 0;
      font: 600 16px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .admin-footer {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      #admin-peek,
      #admin-panel {
        transition: none !important;
      }
    }
  </style>
</head>
<body data-admin="hidden">
  <!--
    Icons: Lucide 1.77.0 (lucide.dev), ISC license; chevron-down, chevron-up and x
    come from Feather (MIT). Full license text in assets/icons/LICENSE. To add an
    icon, copy the inner elements of its SVG into a new <symbol> and use it with
    <svg class="icon"><use href="#icon-name"></use></svg>. Inline, so file://
    needs no network and no extra file (TDD 6.2).
  -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    <symbol id="icon-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6" /></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
  </svg>

  <div id="game-frame"></div>

  <!-- TDD 2.3.5 / D-16b: admin panel, opened from the top strip or with P -->
  <div id="admin-hover-zone"></div>
  <div id="admin-peek">
    <button id="admin-open" class="admin-button" type="button" aria-controls="admin-panel" aria-expanded="false">
      Open admin panel
      <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
    </button>
  </div>
  <section id="admin-panel" aria-labelledby="admin-title">
    <div class="admin-header">
      <h2 id="admin-title" class="admin-title">Admin panel</h2>
      <button class="admin-icon-button" type="button" aria-label="Close admin panel" data-admin-close>
        <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
      </button>
    </div>
    <h3 class="admin-section-title">Live info</h3>
    <dl class="admin-stats">
      <div><dt>FPS</dt><dd data-admin-value="fps">0</dd></div>
      <div><dt>Position</dt><dd data-admin-value="position">0, 0</dd></div>
      <div><dt>Chunk</dt><dd data-admin-value="chunk">0, 0</dd></div>
      <div><dt>Health</dt><dd data-admin-value="health">0</dd></div>
      <div><dt>Ammo</dt><dd data-admin-value="ammo">0</dd></div>
      <div><dt>Enemies loaded</dt><dd data-admin-value="enemies">0</dd></div>
      <div><dt>Chunks loaded</dt><dd data-admin-value="chunks">0</dd></div>
    </dl>
    <div class="admin-footer">
      <button class="admin-button" type="button" data-admin-close>
        Close admin panel
        <svg class="icon" aria-hidden="true"><use href="#icon-chevron-up"></use></svg>
      </button>
    </div>
  </section>

  <!-- TDD 6.1 and 6.2: classic scripts in dependency order, main.js last -->
  <script src="lib/pixi.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mapgen.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/raycaster.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/projectiles.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/weapon-sheet.js"></script>
  <script src="js/weapon.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
